name: Weather Alert Check

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      mock:
        description: "اجرا با mock alert برای تست (true/false)"
        required: false
        default: "false"

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run weather alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AUTHORIZED_USER_ID: ${{ secrets.AUTHORIZED_USER_ID }}
          MOCK_ALERT: ${{ github.event.inputs.mock || 'false' }}
        run: python weather_alert_check.py

      - name: Commit updated state
        run: |
          git config user.name "weather-alert-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update alert state [skip ci]"
          git push
