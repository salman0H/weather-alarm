name: Telegram Listener

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch: {}

jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run telegram listener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python telegram_listener.py

      - name: Commit updated state
        run: |
          git config user.name "weather-alert-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update listener offset/ack state [skip ci]"
          git push
